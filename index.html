<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BinkBox | Website in opbouw</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        }

        .page-wrapper {
            min-height: 100vh;
            position: relative;
            padding-bottom: 180px;
        }

        .main-content {
            min-height: calc(100vh - 180px);
        }

        .coming-soon {
            max-width: 750px;
        }

        .subtle-link {
            color: inherit;
            text-decoration: none;
        }

        .subtle-link:hover {
            text-decoration: underline;
        }

        .binkbox-image {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);

            width: 110px;
            height: 110px;
            object-fit: contain;

            border-radius: 20px;
        }

        .bottom-info {
            position: absolute;
            bottom: 55px;
            left: 0;
            right: 0;
        }

        footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <main class="main-content d-flex align-items-center justify-content-center text-center px-3">
            <div class="coming-soon">

                <p class="text-uppercase text-secondary fw-semibold mb-3">
                    Coming soon
                </p>

                <h1 class="display-3 fw-bold mb-3">
                    BinkBox
                </h1>

                <h2 class="h4 fw-normal text-secondary mb-4">
                    Selfstorage oplossing in Turnhout
                </h2>

            </div>
        </main>


        <img
            src="binkbox-white.jpg"
            alt="BinkBox"
            class="binkbox-image"
        >


        <div class="bottom-info text-center text-secondary px-3">
            Onze vestiging in Mol:
            <a href="https://selfstoragemol.be"
               class="subtle-link fw-semibold"
               target="_blank"
               rel="noopener">
                Selfstorage Mol
            </a>
        </div>

        <footer class="text-center small">
            <a href="https://verhuisnet.be"
               class="subtle-link text-secondary"
               target="_blank"
               rel="noopener">
                Verhuisnet
            </a>
        </footer>

    </div>

</body>
</html>
